name: CausalNerve CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[dev,benchmarks]

    - name: Lint with black and isort
      run: |
        black --check causalnerve/
        isort --check causalnerve/

    - name: Type check with mypy
      run: |
        mypy causalnerve/ --ignore-missing-imports

    - name: Test with pytest and coverage
      run: |
        pytest tests/ --cov=causalnerve --cov-report=xml --cov-fail-under=80

    - name: Validate Documented Failures
      run: |
        pytest benchmarks/test_failure_*.py

    - name: Run benchmarks as smoke test
      run: |
        python benchmarks/run_all.py

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        fail_ci_if_error: false
