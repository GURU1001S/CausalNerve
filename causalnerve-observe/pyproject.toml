[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "causalnerve-observe"
version = "1.0.4"
description = "CausalNerve Observatory and visualization package"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "causalnerve>=1.0.4",
    "plotly>=5.0",
    "dash>=2.0",
    "gradio>=4.0",
]
